<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ra Đề Kiểm Tra Tự Động</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Libraries for File Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .step-content { display: none; animation: fadeIn 0.25s ease-in-out; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .matrix-input { width: 54px; text-align: center; border: 1px solid transparent; border-radius: 4px; padding: 4px; background: transparent; }
        .matrix-input:hover { border-color: #cbd5e1; background: white; }
        .matrix-input:focus { border-color: #3b82f6; background: white; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 60; max-width: 420px; }
        .toast { transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast.show { transform: translateX(0); }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #bank-modal, #ai-config-modal { display: none; }
        #bank-modal.active, #ai-config-modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="resetApp()">
                <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-800">EduAI<span class="text-primary-600">Test</span></span>
            </div>
            <div class="flex items-center gap-3 sm:gap-4">
                <button onclick="openAIConfigModal()" class="text-slate-600 hover:text-primary-600 font-medium text-xs sm:text-sm flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-primary-200 bg-slate-50 transition" title="Cấu hình AI & Nhật ký kỹ thuật">
                    <span id="ai-status-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <i class="fa-solid fa-server text-xs"></i>
                    <span class="hidden sm:inline">Kết nối AI</span>
                </button>
                <button onclick="openBankModal()" class="text-slate-600 hover:text-primary-600 font-medium text-sm flex items-center gap-2 transition">
                    <i class="fa-solid fa-layer-group"></i> <span class="hidden sm:inline">Ngân hàng của tôi</span>
                </button>
                <div class="h-8 w-8 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden cursor-pointer" id="user-avatar" title="Đang kết nối...">
                    <i class="fa-solid fa-user text-slate-400"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-hidden flex flex-col relative">
        <!-- Overlay Loading AI -->
        <div id="ai-loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-30 hidden flex-col items-center justify-center">
            <div class="loader mb-4" style="width: 40px; height: 40px; border-width: 4px;"></div>
            <h3 class="text-lg font-bold text-slate-800 mb-1" id="ai-loading-title">AI Đang Xử Lý...</h3>
            <p class="text-sm text-slate-500" id="ai-loading-desc">Vui lòng chờ trong giây lát.</p>
        </div>

        <!-- Stepper -->
        <div class="bg-white border-b border-slate-200 px-4 py-3 shrink-0 overflow-x-auto">
            <div class="max-w-7xl mx-auto flex items-center justify-between min-w-[700px]">
                <div id="stepper-container" class="flex w-full items-center"></div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto bg-slate-50 p-4 sm:p-6 lg:p-8 relative" id="main-scroll-area">
            <div class="max-w-6xl mx-auto">
                
                <!-- Alert Banner for AI Errors -->
                <div id="ai-error-banner" class="hidden mb-6 bg-red-50 border border-red-200 rounded-xl p-4 text-red-800 shadow-sm">
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-triangle-exclamation text-red-500 text-lg mt-0.5"></i>
                        <div class="flex-1">
                            <h4 class="font-semibold text-sm" id="ai-error-banner-title">Không thể xử lý yêu cầu AI</h4>
                            <p class="text-xs text-red-700 mt-1 leading-relaxed" id="ai-error-banner-msg"></p>
                            <div class="mt-2.5 flex flex-wrap gap-2">
                                <button onclick="openAIConfigModal()" class="text-xs font-medium bg-white border border-red-200 text-red-700 hover:bg-red-100 px-3 py-1 rounded-md transition">
                                    <i class="fa-solid fa-wrench mr-1"></i> Kiểm tra Kết nối & Cấu hình AI
                                </button>
                                <button onclick="hideErrorBanner()" class="text-xs text-red-600 hover:underline px-2 py-1">Đóng</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 1: THIẾT LẬP -->
                <div id="step-1" class="step-content active">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-slate-800">Thiết lập thông số & Học liệu</h2>
                        <p class="text-slate-500 mt-1">Khai báo thông tin cơ bản và cung cấp tài liệu để AI phân tích cấu trúc đề.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 class="font-semibold text-slate-800 border-b pb-3 mb-4"><i class="fa-solid fa-sliders text-primary-500 mr-2"></i>Thông số cơ bản</h3>
                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Cấp học</label>
                                        <select id="p-caphoc" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                            <option>THPT</option><option>THCS</option><option>Tiểu học</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Môn học</label>
                                        <input type="text" id="p-monhoc" value="Địa lí" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Khối lớp</label>
                                        <select id="p-khoilop" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                            <option>Lớp 12</option><option>Lớp 11</option><option>Lớp 10</option>
                                            <option>Lớp 9</option><option>Lớp 8</option><option>Lớp 7</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Kỳ kiểm tra</label>
                                        <select id="p-kykiemtra" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                            <option>Giữa HK1</option><option>Cuối HK1</option><option>Giữa HK2</option><option>Cuối HK2</option><option>Kiểm tra 15p</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                     <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Thời gian (phút)</label>
                                        <input type="number" id="p-thoigian" min="5" max="180" value="45" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Cấu trúc đề</label>
                                        <select id="p-cautruc" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm">
                                            <option>Trắc nghiệm 100%</option>
                                            <option>Trắc nghiệm + Tự luận</option>
                                            <option>Định dạng Bộ GD 2025</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                             <h3 class="font-semibold text-slate-800 border-b pb-3 mb-4"><i class="fa-solid fa-file-arrow-up text-primary-500 mr-2"></i>Nguồn dữ liệu / Phạm vi</h3>
                             
                             <label class="block border-2 border-dashed border-slate-300 rounded-xl p-6 text-center bg-slate-50 hover:bg-primary-50 transition cursor-pointer group mb-4">
                                 <input type="file" id="file-upload" accept=".pdf,.doc,.docx" class="hidden" onchange="handleFileUpload(event)">
                                 <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mx-auto shadow-sm mb-3 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-cloud-arrow-up text-xl text-primary-500"></i>
                                 </div>
                                 <p class="text-sm font-medium text-slate-700 mb-1" id="file-name-display">Click hoặc Kéo thả Ma trận mẫu / SGK</p>
                                 <p class="text-xs text-slate-500">Hỗ trợ PDF, Word (.docx). Tối đa 5MB.</p>
                             </label>

                             <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Chi tiết phạm vi kiến thức (Bắt buộc hoặc Tùy chọn nếu đã tải file):</label>
                                <textarea id="p-phamvi" rows="4" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-primary-500 outline-none text-sm resize-none" placeholder="VD: Vị trí địa lí
